events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # API traffic → FastAPI backend
        location /api/ {
            proxy_pass http://backend;
            # nginx's defaults are a 60-second wait for the backend and a 1 MB request
            # body. An answer generated by a local model on a CPU can take longer than
            # that, and an uploaded PDF or zip can be larger.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Student React app — static files
        location /student/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /student/index.html;
        }

        # Staff React app — static files
        location /staff/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /staff/index.html;
        }

        # Admin React app — static files
        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Root redirect
        location = / {
            return 302 /student/;
        }
    }
}
